[package]
name = "cozy-corner"
version = "0.1.0"
description = "A tiny always-on-top pixel room for your desktop"
authors = ["you"]
edition = "2021"

[lib]
name = "cozy_corner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
