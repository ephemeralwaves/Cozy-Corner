<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cozy Corner</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="widget">
      <div class="drag" data-tauri-drag-region></div>
      <canvas id="room" width="320" height="248"></canvas>
      <button type="button" id="radio-hotspot" title="Play / pause piano" data-tauri-drag-region="false"></button>
      <button type="button" id="board-hotspot" title="To-do list" data-tauri-drag-region="false"></button>
      <button type="button" id="buddy-hotspot" title="Play piano" data-tauri-drag-region="false"></button>
      <button type="button" id="cat-hotspot" title="Customize cat" data-tauri-drag-region="false"></button>
      <div id="notes" class="notes" hidden>♪ ♫</div>
      <section id="todos" class="todo-panel" hidden>
        <header class="todo-head">
          <h1>To-do</h1>
          <button type="button" id="todo-close" title="Close" aria-label="Close">×</button>
        </header>
        <ul id="todo-list" class="todo-list"></ul>
        <form id="todo-form" class="todo-form">
          <input id="todo-input" type="text" maxlength="80" placeholder="Add a note…" autocomplete="off" />
          <button type="submit">Add</button>
        </form>
      </section>
    </div>
    <section id="customize" class="customize-panel" hidden>
      <div class="cust-tabs" id="cust-tabs">
        <button type="button" data-tab="room" class="on">Room</button>
        <button type="button" data-tab="self">You</button>
        <button type="button" data-tab="cat">Pet</button>
      </div>
      <div data-panel="room">
        <div class="customize-row">
          <span class="row-label">Style</span>
          <div id="styles-room" class="presets hair-styles robe-wear">
            <button type="button" data-room-style="modern">Modern</button>
            <button type="button" data-room-style="dynasty">Dynasty</button>
          </div>
        </div>
        <div class="customize-row">
          <label>Wall <input id="color-wall" type="color" /></label>
          <label>Floor <input id="color-floor" type="color" /></label>
          <label>Furniture <input id="color-furniture" type="color" /></label>
        </div>
        <div class="customize-row">
          <label>Rug <input id="color-rug" type="color" /></label>
          <label>Board <input id="color-board" type="color" /></label>
          <label>Glass <input id="color-glass" type="color" /></label>
        </div>
        <div class="customize-row">
          <span class="row-label">Panes</span>
          <div id="styles-window" class="presets hair-styles robe-wear">
            <button type="button" data-window="sky">Sky</button>
            <button type="button" data-window="desktop">Desktop</button>
          </div>
        </div>
        <div id="presets-room" class="presets">
          <button type="button" data-preset="cream">Cream</button>
          <button type="button" data-preset="sage">Sage</button>
          <button type="button" data-preset="blush">Blush</button>
          <button type="button" data-preset="night">Night</button>
          <button type="button" data-preset="sky">Sky</button>
          <button type="button" data-preset="dynasty">Tang</button>
        </div>
      </div>
      <div data-panel="self" hidden>
        <div class="customize-row">
          <label>Hair <input id="color-hair" type="color" /></label>
          <label>Skin <input id="color-skin" type="color" /></label>
          <label>Shirt <input id="color-shirt" type="color" /></label>
          <label>Pants <input id="color-pants" type="color" /></label>
        </div>
        <div id="styles-hair" class="presets hair-styles">
          <button type="button" data-hair="short">Short</button>
          <button type="button" data-hair="long">Long</button>
          <button type="button" data-hair="afro">Afro</button>
          <button type="button" data-hair="bun">Bun</button>
          <button type="button" data-hair="pony">Pony</button>
        </div>
        <div id="presets-self" class="presets">
          <button type="button" data-self="default">Teal</button>
          <button type="button" data-self="raven">Raven</button>
          <button type="button" data-self="berry">Berry</button>
          <button type="button" data-self="moss">Moss</button>
        </div>
        <div class="customize-row">
          <span class="row-label">Robe</span>
          <div id="styles-robe" class="presets hair-styles robe-wear">
            <button type="button" data-robe="off">Off</button>
            <button type="button" data-robe="on">On</button>
          </div>
        </div>
        <div class="customize-row">
          <label>Cloth <input id="color-robe" type="color" /></label>
          <label>Sash <input id="color-sash" type="color" /></label>
        </div>
        <div id="presets-robe" class="presets">
          <button type="button" data-robe-preset="sky">Sky</button>
          <button type="button" data-robe-preset="ink">Ink</button>
          <button type="button" data-robe-preset="rose">Rose</button>
          <button type="button" data-robe-preset="moss">Moss</button>
        </div>
      </div>
      <div data-panel="cat" hidden>
        <div class="customize-row">
          <span class="row-label">Kind</span>
          <div id="styles-pet" class="presets hair-styles robe-wear">
            <button type="button" data-pet="cat">Cat</button>
            <button type="button" data-pet="dog">Dog</button>
          </div>
        </div>
        <div class="customize-row">
          <label>Fur <input id="color-fur" type="color" /></label>
        </div>
        <div id="presets-cat" class="presets">
          <button type="button" data-cat="orange">Orange</button>
          <button type="button" data-cat="gray">Gray</button>
          <button type="button" data-cat="black">Black</button>
          <button type="button" data-cat="cream">Cream</button>
        </div>
        <div id="presets-dog" class="presets" hidden>
          <button type="button" data-dog="golden">Golden</button>
          <button type="button" data-dog="brown">Brown</button>
          <button type="button" data-dog="black">Black</button>
          <button type="button" data-dog="white">White</button>
        </div>
      </div>
      <button type="button" id="customize-done">Done</button>
    </section>
    <div id="menu" class="menu" hidden>
      <button type="button" data-action="customize">Customize</button>
      <button type="button" data-action="player">YouTube Player</button>
      <button type="button" data-action="play">Play / Pause</button>
      <button type="button" data-action="stop">Stop music</button>
      <button type="button" data-action="hide">Hide</button>
      <button type="button" data-action="quit">Quit</button>
    </div>
  </body>
</html>
